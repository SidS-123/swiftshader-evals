# Every pinned input of the ssvk images. `build_ref.sh` passes these to Docker
# as build args; change a pin here and nowhere else. Format: KEY=VALUE.

# Base image and apt snapshot (every apt package resolves from this instant).
BASE_IMAGE=ubuntu@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
APT_SNAPSHOT=20260928T000000Z

# Oracle of record (D2): SwiftShader, CMake, LLVM 10 backend; Subzero as a perturbation.
SWIFTSHADER_URL=https://github.com/google/swiftshader.git
SWIFTSHADER_COMMIT=1e80438d2b93ef36a7c05f8d2b81233bac0e3d16
SWIFTSHADER_GLSLANG_COMMIT=2b2523fb951f63f072cfba514c26f2feea5f4329
SWIFTSHADER_GOOGLETEST_COMMIT=e2239ee6043f73722e7aa812a459f54a28552929
SWIFTSHADER_LLVM_VERSION=10.0

# Khronos loader, layers, tools, shader tools: one SDK tag across repos. It is the
# closest SDK to SwiftShader's own headers (VK_HEADER_VERSION 355).
VULKAN_SDK_TAG=vulkan-sdk-1.4.357.0

# vkreplay's JSON parser (header-only).
NLOHMANN_JSON_TAG=v3.12.0

# Fairness comparator (D12): Mesa lavapipe.
MESA_TAG=mesa-26.2.3
MESON_VERSION=1.9.1
MAKO_VERSION=1.3.10
PYYAML_VERSION=6.0.2
PACKAGING_VERSION=25.0
