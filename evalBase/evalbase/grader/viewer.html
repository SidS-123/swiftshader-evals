<!doctype html>
<meta charset="utf-8">
<title>__SITE_TITLE__ results</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Minimal data viewer for the evalbase site bundle written by
  `python3 -m grader.export`. Single file, no build step, vanilla JS; every
  fetch is relative to this page, so `python3 -m http.server` in the site
  directory is enough. This is the blog author's inspection tool, not the
  published post.
-->
<style>
  :root {
    --bg: #12131a; --panel: #1b1d26; --line: #2c2f3d; --fg: #e7e9f0;
    --dim: #9aa0b4; --accent: #7fb4ff; --good: #62c37a; --bad: #e05252;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5
         ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex;
           gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  main { padding: 20px; max-width: 1400px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 20px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
           font-variant-numeric: tabular-nums; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase;
       letter-spacing: .05em; }
  td.num, th.num { text-align: right; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 14px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .thumb { width: 100%; image-rendering: pixelated; border-radius: 4px; background: #000;
           display: block; }
  .panels { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: start; }
  .panels figure { margin: 0; }
  .panels img { width: 100%; image-rendering: pixelated; border: 1px solid var(--line);
                border-radius: 4px; background: #000; }
  figcaption { color: var(--dim); font-size: 12px; padding-top: 4px; }
  .bar { height: 6px; background: #000; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .muted { color: var(--dim); }
  .pill { font-size: 11px; padding: 1px 7px; border: 1px solid var(--line);
          border-radius: 999px; color: var(--dim); }
  input[type=range] { width: 100%; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .err { color: var(--bad); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--dim); }
</style>

<header>
  <h1><a href="#/">__SITE_TITLE__</a></h1>
  <span class="muted" id="crumb"></span>
</header>
<main id="app">loading…</main>

<script>
const app = document.getElementById('app');
const crumb = document.getElementById('crumb');
const cache = new Map();

const num = (x, d = 4) => (x === null || x === undefined || Number.isNaN(x)) ? '—' : Number(x).toFixed(d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function getJSON(path) {
  if (!cache.has(path)) {
    cache.set(path, fetch(path, {cache: 'no-store'}).then(r => {
      if (!r.ok) throw new Error(path + ': HTTP ' + r.status);
      return r.json();
    }));
  }
  return cache.get(path);
}

function bar(v) { return `<div class="bar"><i style="width:${Math.max(0, Math.min(1, v || 0)) * 100}%"></i></div>`; }

// The snapshot worth showing as a thumbnail: the one the metric liked least.
function worstImage(e) {
  if (!e.images || !e.images.length) return null;
  const i = Math.min(e.max_defect_snapshot ?? 0, e.images.length - 1);
  return e.images[Math.max(0, i)];
}
function thumb(base, e) {
  const img = worstImage(e);
  return img ? `<img class="thumb" src="${base}${img.cand}" alt="">`
             : `<div class="thumb muted" style="padding:20px 0;text-align:center">no snapshots</div>`;
}

// ---------------------------------------------------------------- leaderboard
async function viewLeaderboard() {
  crumb.textContent = 'leaderboard';
  const rows = await getJSON('leaderboard.json');
  const cats = __CATEGORIES__;
  app.innerHTML = `
    <h2>Leaderboard</h2>
    <table>
      <tr><th>#</th><th>Run</th><th>Model</th><th>Harness</th>
          <th class="num">Overall</th>${cats.map(c => `<th class="num">${c}</th>`).join('')}
          <th class="num">Cases</th><th class="num">Ckpts</th><th class="num">Wall h</th></tr>
      ${rows.map((r, i) => `<tr>
        <td class="muted">${i + 1}</td>
        <td><a href="#/run/${encodeURIComponent(r.candidate)}">${esc(r.label)}</a>
            ${r.baseline ? '<span class="pill">control</span>' : ''}</td>
        <td class="muted">${esc(r.model || '—')}</td>
        <td class="muted">${esc(r.harness || '—')}</td>
        <td class="num">${num(r.overall)}</td>
        ${cats.map(c => `<td class="num">${r.sections && r.sections[c] ? num(r.sections[c].score) : '—'}</td>`).join('')}
        <td class="num">${r.n_testcases ?? '—'}</td>
        <td class="num">${r.checkpoints_count ?? 0}</td>
        <td class="num">${r.wall_clock_hours ? num(r.wall_clock_hours, 2) : '—'}</td>
      </tr>`).join('')}
    </table>
    <p class="muted">Weights are the nominal docs/DESIGN.md weights
    (nominal weights renormalised); a run that graded only some
    categories renormalises over the ones present.</p>
    <div id="cmp"></div>`;
  try {
    const cmps = await getJSON('compare/index.json');
    document.getElementById('cmp').innerHTML = `<h2>Comparisons</h2><ul>` + cmps.map(c =>
      `<li><a href="#/compare/${encodeURIComponent(c.key)}">${esc(c.a.label)} vs ${esc(c.b.label)}</a>
       <span class="muted">(${c.n_cases} cases)</span></li>`).join('') + `</ul>`;
  } catch (e) { /* no comparisons exported */ }
}

// ---------------------------------------------------------------- run page
async function viewRun(candidate) {
  crumb.innerHTML = `<a href="#/">leaderboard</a> / ${esc(candidate)}`;
  const base = `results/${candidate}/`;
  const [s, meta, bands] = await Promise.all([
    getJSON(base + 'summary.json'), getJSON(base + 'metadata.json').catch(() => null),
    getJSON(base + 'bands.json').catch(() => null)]);
  const cases = Object.entries(s.per_testcase).sort((a, b) => a[1].score - b[1].score);
  const tv = (meta && meta.task_version) || {};
  app.innerHTML = `
    <h2>${esc(s.label)} <span class="muted">overall ${num(s.overall)}</span>
        ${s.full_success ? '<span class="pill">full success</span>' : ''}</h2>
    <div class="kv" style="margin-bottom:16px">
      <div>model</div><div>${esc(s.model || '—')}</div>
      <div>harness</div><div>${esc(s.harness || '—')}${meta && meta.harness_version ? ' · ' + esc(meta.harness_version) : ''}</div>
      <div>graded at</div><div>${esc(s.graded_at)}</div>
      <div>stop reason</div><div>${esc((meta && meta.stop_reason) || '—')}</div>
      <div>budget</div><div>${meta && meta.budget ? esc(meta.budget.hours) + ' h, checkpoint every ' + esc(meta.budget.checkpoint_seconds / 60) + ' min' : '—'}</div>
      <div>usage</div><div>${meta && meta.usage ? `${meta.usage.input_tokens ?? '—'} in / ${meta.usage.output_tokens ?? '—'} out / $${meta.usage.cost_usd ?? '—'}` : '—'}</div>
      <div>task version</div><div><code>${esc((tv.git_commit || '').slice(0, 12) || '—')}</code>
        corpus <code>${esc((tv.corpus_sha256 || '').slice(0, 12) || '—')}</code>
        grader <code>${esc((tv.grader_sha256 || '').slice(0, 12) || '—')}</code></div>
    </div>

    <h2>Sections</h2>
    <table>
      <tr><th>Section</th><th class="num">Score</th><th class="num">Weight</th>
          <th class="num">Effective</th><th class="num">n</th>
          <th>Per-family means <span class="muted">(not a rollup of the score)</span></th></tr>
      ${Object.entries(s.sections).map(([k, v]) => `<tr>
        <td>${esc(k)}</td><td class="num">${num(v.score)}</td>
        <td class="num">${num(v.weight, 2)}</td><td class="num">${num(v.effective_weight, 3)}</td>
        <td class="num">${v.n}</td>
        <td class="muted">${Object.entries(v.family_means || v.subsystems || {}).map(([a, b]) => `${esc(a)} ${num(b, 2)}`).join(' · ') || '—'}</td>
      </tr>`).join('')}
    </table>

    <h2>Checkpoint progression</h2>
    <div id="ckpt" class="muted">loading…</div>

    <h2>Cases <span class="muted">(${cases.length}, worst first)</span></h2>
    <div class="grid">
      ${cases.map(([name, e]) => `<div class="card">
        <a href="#/case/${encodeURIComponent(candidate)}/${encodeURIComponent(name)}">
          ${thumb(base, e)}
        </a>
        <div style="margin-top:8px"><a href="#/case/${encodeURIComponent(candidate)}/${encodeURIComponent(name)}">${esc(name)}</a></div>
        <div class="muted" style="font-size:12px">${esc(e.section)} · ${esc(e.subsystem)} ·
          ${e.n_snapshots} snapshots · exit ${esc(e.exit)}</div>
        <div style="margin-top:6px">${bar(e.score)}</div>
        <div class="muted" style="font-size:12px">score ${num(e.score)}${e.fidelity_score !== e.score ? ` · fidelity ${num(e.fidelity_score)}` : ''}
          · T ${num(e.threshold, 3)}${e.first_diverge_snapshot !== null && e.first_diverge_snapshot !== undefined ? ` · diverges @${e.first_diverge_snapshot}` : ''}</div>
      </div>`).join('')}
    </div>

    <h2>Score bands</h2>
    <div id="bands"></div>`;

  if (bands) {
    document.getElementById('bands').innerHTML = bands.bands.map(b => `
      <div style="margin-bottom:18px">
        <b>${esc(b.band)}</b> <span class="muted">${esc(b.note)}</span>
        <div class="grid" style="margin-top:8px">
          ${b.examples.length ? b.examples.map(x => `<div class="card">
            <a href="#/case/${encodeURIComponent(candidate)}/${encodeURIComponent(x.name)}">
              ${x.images ? `<img class="thumb" src="${base}${x.images.cand}" alt="">`
                         : '<div class="thumb muted" style="padding:20px 0;text-align:center">no snapshots</div>'}</a>
            <div style="margin-top:6px">${esc(x.name)}</div>
            <div class="muted" style="font-size:12px">fidelity ${num(x.fidelity_score)} · ${x.n_snapshots} snapshots</div>
          </div>`).join('') : '<span class="muted">no case in this band</span>'}
        </div>
      </div>`).join('');
  }

  try {
    const ck = await getJSON(base + 'checkpoints/index.json');
    const el = document.getElementById('ckpt');
    const ok = ck.filter(c => c.status === 'ok');
    el.innerHTML = ck.length === 0 ? '<span class="muted">no checkpoints graded for this run</span>'
      : (ok.length >= 2 ? sparkline(ok.map(c => c.overall), 640, 140, s.overall) : '')
        + `<table><tr><th class="num">#</th><th>Status</th><th class="num">Overall</th>
             <th class="num">Elapsed s</th><th>Note</th></tr>` +
          ck.map(c => `<tr><td class="num">${c.checkpoint_id}</td>
            <td class="${c.status === 'ok' ? '' : 'err'}">${esc(c.status)}${c.error ? ' (' + esc(c.error) + ')' : ''}</td>
            <td class="num">${c.overall === undefined ? '—' : num(c.overall)}</td>
            <td class="num">${c.elapsed_seconds === null || c.elapsed_seconds === undefined ? '—' : num(c.elapsed_seconds, 1)}</td>
            <td class="muted">${esc(c.note || '')}</td></tr>`).join('') + '</table>';
  } catch (e) {
    document.getElementById('ckpt').innerHTML = '<span class="muted">no checkpoint index</span>';
  }
}

function sparkline(values, w, h, final) {
  const pad = 28, n = values.length;
  const x = i => pad + (n === 1 ? 0 : i * (w - pad - 8) / (n - 1));
  const y = v => h - pad - Math.max(0, Math.min(1, v)) * (h - pad - 8);
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="max-width:100%">
    <rect x="${pad}" y="8" width="${w - pad - 8}" height="${h - pad - 8}" fill="#0c0d12" stroke="#2c2f3d"/>
    ${[0, 0.5, 1].map(v => `<line x1="${pad}" x2="${w - 8}" y1="${y(v)}" y2="${y(v)}" stroke="#2c2f3d"/>
      <text x="2" y="${y(v) + 4}" fill="#9aa0b4" font-size="10">${v.toFixed(1)}</text>`).join('')}
    ${final !== undefined ? `<line x1="${pad}" x2="${w - 8}" y1="${y(final)}" y2="${y(final)}" stroke="#62c37a" stroke-dasharray="4 3"/>` : ''}
    <polyline fill="none" stroke="#7fb4ff" stroke-width="2" points="${pts}"/>
    ${values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#7fb4ff"><title>#${i + 1}: ${v}</title></circle>`).join('')}
  </svg>`;
}

// ---------------------------------------------------------------- case page
function chart(values, w, h, line, lineLabel, color) {
  const pad = 32, n = values.length;
  const top = Math.max(1e-6, Math.max(line * 1.6, ...values.map(v => v || 0)) * 1.08);
  const x = i => pad + (n === 1 ? (w - pad - 8) / 2 : i * (w - pad - 8) / (n - 1));
  const y = v => h - 20 - (Math.max(0, v) / top) * (h - 28);
  const pts = values.map((v, i) => `${x(i)},${y(v || 0)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="max-width:100%">
    <rect x="${pad}" y="8" width="${w - pad - 8}" height="${h - 28}" fill="#0c0d12" stroke="#2c2f3d"/>
    <line x1="${pad}" x2="${w - 8}" y1="${y(line)}" y2="${y(line)}" stroke="#e05252" stroke-dasharray="5 3"/>
    <text x="${w - 10}" y="${y(line) - 4}" fill="#e05252" font-size="10" text-anchor="end">${lineLabel}</text>
    <text x="2" y="14" fill="#9aa0b4" font-size="10">${top.toFixed(2)}</text>
    <text x="2" y="${h - 22}" fill="#9aa0b4" font-size="10">0</text>
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/>
    ${values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v || 0)}" r="3" fill="${color}"
       data-index="${i}" class="pt"><title>snapshot ${i}: ${v}</title></circle>`).join('')}
  </svg>`;
}

async function viewCase(candidate, name) {
  crumb.innerHTML = `<a href="#/">leaderboard</a> / <a href="#/run/${encodeURIComponent(candidate)}">${esc(candidate)}</a> / ${esc(name)}`;
  const base = `results/${candidate}/`;
  const s = await getJSON(base + 'summary.json');
  const e = s.per_testcase[name];
  if (!e) { app.innerHTML = `<p class="err">no such case: ${esc(name)}</p>`; return; }
  const T = e.threshold || 0.03;
  app.innerHTML = `
    <h2>${esc(name)} <span class="muted">${esc(e.section)} · ${esc(e.subsystem)}</span></h2>
    <div class="kv" style="margin-bottom:14px">
      <div>score</div><div>${num(e.score)}${e.fidelity_score !== e.score ? ` (fidelity ${num(e.fidelity_score)})` : ''}</div>
      <div>threshold T</div><div>${num(T, 4)} <span class="muted">noise ${num(e.reference.noise, 4)} ·
        sensitivity ${num(e.reference.sensitivity, 4)} · motion p90 ${num(e.reference.motion_p90, 4)}</span></div>
      <div>snapshots</div><div>${e.n_snapshots}${e.missing_snapshots ? ` (<span class="err">${e.missing_snapshots} missing from the candidate</span>)` : ''}</div>
      <div>first divergence</div><div>${e.first_diverge_snapshot ?? '—'} <span class="muted">(first snapshot scoring &lt; 0.5)</span></div>
      <div>exit</div><div class="${e.exit === 'ok' ? '' : 'err'}">${esc(e.exit)}</div>
      ${e.ratio !== undefined ? `<div>time ratio</div><div>${e.ratio_unmeasurable
          ? '<span class="err">not measurable</span> <span class="muted">(crash, timeout, or fidelity score below 0.5)</span>'
          : num(e.ratio, 2) + ' <span class="muted">candidate / reference</span>'}</div>` : ''}
      ${e.checks_total ? `<div>ledger checks</div><div>${e.checks_total - (e.checks_failed || []).length}/${e.checks_total} passed
        ${(e.checks_failed || []).length ? `<div class="err" style="font-size:12px">${esc((e.checks_failed || []).slice(0, 12).join(', '))}</div>` : ''}</div>` : ''}
    </div>

    <div class="panels" id="panels"></div>
    <div style="margin:14px 0 6px"><input type="range" id="slider" min="0" max="${Math.max(0, e.images.length - 1)}" value="0"></div>
    <div class="muted" id="snapinfo"></div>

    ${e.anim ? `<h2>Animated strip</h2>
      <img src="${base}${e.anim}" style="max-width:100%;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px">
      <div class="muted" style="font-size:12px">reference | candidate | block-defect heatmap</div>` : ''}

    <h2>Per-snapshot score <span class="muted">(threshold line at 0.5 = defect D equals T)</span></h2>
    ${chart(e.snapshot_scores, 760, 180, 0.5, 'score 0.5 (D = T)', '#7fb4ff')}
    <h2>Per-snapshot defect <span class="muted">(threshold line at T = ${num(T, 4)})</span></h2>
    ${chart(e.snapshot_defects, 760, 180, T, 'T = ' + num(T, 4), '#e2b04a')}

    <h2>Heatmap legend</h2>
    <p class="muted" style="max-width:720px">One cell is one 16×16 source-pixel block.
    Grey cells are below the 0.15 perceptual floor and are scored as zero; the cool→hot
    ramp runs from just-above-floor to a fully wrong block, which is red.</p>`;

  const panels = document.getElementById('panels');
  const slider = document.getElementById('slider');
  const info = document.getElementById('snapinfo');
  function show(i) {
    const img = e.images[i];
    if (!img) { panels.innerHTML = '<span class="muted">no snapshots exported</span>'; return; }
    panels.innerHTML = `
      <figure><img src="${base}${img.ref}"><figcaption>reference — ${esc(img.snapshot)}</figcaption></figure>
      <figure><img src="${base}${img.cand}"><figcaption>candidate${img.candidate_missing ? ' (missing — shown black)' : ''}</figcaption></figure>
      <figure><img src="${base}${img.heat}"><figcaption>block defect${img.monochrome_override ? ' — near-uniform candidate snapshot, D forced to 1' : ''}</figcaption></figure>`;
    info.innerHTML = `snapshot ${i} / ${e.images.length - 1} · defect ${num(img.defect)} ·
      score ${num(img.score)} · T ${num(T, 4)}`;
  }
  slider.addEventListener('input', () => show(+slider.value));
  document.querySelectorAll('circle.pt').forEach(c => c.addEventListener('click', () => {
    slider.value = c.dataset.index; show(+c.dataset.index);
  }));
  const start = Math.max(0, Math.min(e.max_defect_snapshot ?? 0, e.images.length - 1));
  slider.value = start;
  show(start);
}

// ---------------------------------------------------------------- compare page
async function viewCompare(key) {
  crumb.innerHTML = `<a href="#/">leaderboard</a> / compare / ${esc(key)}`;
  const idx = await getJSON(`compare/${key}/index.json`);
  app.innerHTML = `
    <h2>${esc(idx.a.label)} <span class="muted">(${num(idx.a.overall)})</span> vs
        ${esc(idx.b.label)} <span class="muted">(${num(idx.b.overall)})</span></h2>
    <p class="muted">Each figure is reference | ${esc(idx.a.label)} | ${esc(idx.b.label)}
       at the snapshot where the two candidates differ most from the reference.</p>
    ${idx.cases.map(c => `<div class="card" style="margin-bottom:14px">
      <div><b>${esc(c.name)}</b> <span class="muted">${esc(c.section)} · ${esc(c.subsystem)} ·
        snapshot ${c.snapshot} · T ${num(c.threshold, 4)}</span></div>
      <div class="muted" style="font-size:12px">${esc(idx.a.label)} ${num(c.a.score)} (D ${num(c.a.defect)}) ·
        ${esc(idx.b.label)} ${num(c.b.score)} (D ${num(c.b.defect)})</div>
      <img src="${c.figure}" style="width:100%;margin-top:8px;image-rendering:pixelated;border-radius:4px">
    </div>`).join('')}`;
}

// ---------------------------------------------------------------- router
async function route() {
  const parts = decodeURI(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
  try {
    if (parts[0] === 'run' && parts[1]) await viewRun(parts[1]);
    else if (parts[0] === 'case' && parts[2]) await viewCase(parts[1], parts.slice(2).join('/'));
    else if (parts[0] === 'compare' && parts[1]) await viewCompare(parts[1]);
    else await viewLeaderboard();
  } catch (err) {
    app.innerHTML = `<p class="err">${esc(err.message || err)}</p>
      <p class="muted">Serve the site directory, e.g. <code>python3 -m http.server</code>.</p>`;
  }
}
addEventListener('hashchange', route);
route();
</script>
